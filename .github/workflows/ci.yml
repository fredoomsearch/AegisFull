name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          AEGIS_AUTH_MODE: off
          AEGIS_DISABLE_DB: "1"
          AEGIS_DEMO_MODE: "1"
          AEGIS_LLM_WARMUP: "0"
          AEGIS_ENABLE_TOOLS_API: "0"
        run: |
          pytest -q
      - name: Adversarial routing gate
        env:
          AEGIS_AUTH_MODE: off
          AEGIS_DISABLE_DB: "1"
          AEGIS_DEMO_MODE: "1"
          AEGIS_LLM_WARMUP: "0"
          AEGIS_ENABLE_TOOLS_API: "0"
          AEGIS_ROUTER_DETERMINISTIC_STRICT: "1"
          AEGIS_ROUTER_FAIL_CLOSED: "1"
          AEGIS_FOCUS_CLEAR_ON_TOPIC_SWITCH: "1"
        run: |
          python -m app.scripts.adversarial_eval_check --strict --min-cases 500

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm install
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test
